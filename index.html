ointer;text-align:left;width:100%;color:inherit}.hit:focus,.hit:hover{border-color:#74bcff}.hit strong{font-size:14px;display:block}.hit .excerpt{font-size:13px;line-height:1.6;color:#d0dfea;margin:9px 0 0;overflow-wrap:anywhere}mark{background:#ffe18a;color:#1e2c3d;border-radius:2px;padding:0 2px}.count{color:#acd2f1;font-size:12px}.tag{font-size:11px;color:#a9d7ff;background:#1b4a6b;border-radius:7px;padding:5px 8px}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0c243b;border-top:1px solid #32536c;z-index:9;padding:9px 0 calc(8px + env(safe-area-inset-bottom));justify-content:space-around}.tab{background:none;border:0;color:#a4bfd8;font-size:11px;font-weight:750;padding:7px 10px;display:flex;flex-direction:column;align-items:center;gap:5px}.tab i{font-size:22px;font-style:normal}.tab.on{color:#8ccaff}.viewer{width:100%;height:64dvh;border:0;background:#fff;border-radius:10px;margin-top:12px}.empty{text-align:center;border:1px dashed #52708b;padding:26px;border-radius:14px;color:#bfd0e1;font-size:13px}.hide{display:none!important}progress{width:100%;height:8px;accent-color:#56b7ff}input[type=file]{display:none}.file-label{display:inline-block;cursor:pointer}.result-top{font-size:14px;margin:14px 0;display:flex;justify-content:space-between;align-items:center}.meta{font-size:12px;color:#bbcee2}.footnote{font-size:12px;line-height:1.6;color:#aec6d9}@media(min-width:700px){.results{display:grid;grid-template-columns:1fr 1fr;gap:12px}.nav{max-width:600px;left:50%;transform:translateX(-50%);border-radius:18px 18px 0 0}}
 .tocline{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #29465d;font-size:13px}.tocline a{flex:1;text-decoration:none}.tocline span{font-size:11px;white-space:nowrap;color:#abc5db}.rulelink{color:#86d0ff;text-decoration:underline;text-underline-offset:3px}.section-entry{display:block;background:#173a57;border-left:3px solid #73c6ff;padding:6px;margin:8px 0}.linkedtext{line-height:1.65;overflow-wrap:anywhere} </style></head><body>
<header class="top"><div class="wrap"><div class="brand">🏒 Sääntökirja</div><div class="subtitle">2026–2027 · haku suoraan omasta PDF-tiedostosta</div></div></header>
<section id="hero" class="hero wrap"><h1 id="pageTitle">Hae sääntökirjasta</h1><p id="pageIntro">Etsi sääntönumerolla, sanalla tai useammalla hakusanalla. Kaikki osumat näytetään.</p><div class="search">⌕ <input id="query" type="search" placeholder="Esim. 57.2, kampitus tai korkea maila" aria-label="Hakusana" autocomplete="off"></div><div class="chips"><button class="chip" data-example="kampitus">Kampitus</button><button class="chip" data-example="korkea maila">Korkea maila</button><button class="chip" data-example="pieni rangaistus">Pieni rangaistus</button><button class="chip" data-example="57.2">57.2</button></div></section>
<main class="main"><section id="setup"></section><section id="results"></section><section id="detail" class="hide"></section><section id="about" class="hide"></section></main>
<nav class="nav" aria-label="Valikko"><button data-tab="search" class="tab on"><i>⌕</i>Haku</button><button data-tab="penalties" class="tab"><i>▤</i>Rangaistukset</button><button data-tab="favorites" class="tab"><i>★</i>Suosikit</button><button data-tab="about" class="tab"><i>ⓘ</i>Ohjeet</button></nav>
<script type="module">
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';
const WORKER='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
const DB='saantokirja-local-v2', STORE='files', KEY='own-pdf';
const $=s=>document.querySelector(s);let lib=null,doc=null,bytes=null,pages=[],favorites=new Set(),tab='search',detail=null,term='',building=false, blobUrl=null,ruleMap={},tocItems=[],navHistory=[],targetRule=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\x27':'&#39;'}[c]));
const norm=s=>String(s).toLocaleLowerCase('fi').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
function db(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function get(key){let d=await db();return new Promise((res,rej)=>{let t=d.transaction(STORE,'readonly'),r=t.objectStore(STORE).get(key);r.onsuccess=()=>{res(r.result);d.close()};r.onerror=()=>{rej(r.error);d.close()}})}
async function put(key,value){let d=await db();return new Promise((res,rej)=>{let t=d.transaction(STORE,'readwrite');t.objectStore(STORE).put(value,key);t.oncomplete=()=>{d.close();res()};t.onerror=()=>{d.close();rej(t.error)}})}
async function remove(key){let d=await db();return new Promise((res,rej)=>{let t=d.transaction(STORE,'readwrite');t.objectStore(STORE).delete(key);t.oncomplete=()=>{d.close();res()};t.onerror=()=>{d.close();rej(t.error)}})}
function status(x){$('#setup').innerHTML='<div class="panel"><div class="status">'+esc(x)+'</div></div>'}
async function loadLib(){if(lib)return lib;status('Ladataan PDF-lukijaa…');lib=await import(PDFJS);lib.GlobalWorkerOptions.workerSrc=WORKER;return lib}
async function openPDF(data){let l=await loadLib();bytes=new Uint8Array(data);doc=await l.getDocument({data:new Uint8Array(bytes)}).promise;return doc}
async function indexPDF(){building=true;pages=[];$('#setup').innerHTML='<div class="panel"><h2>Luetaan sääntökirjaa…</h2><progress id="pr" value="0" max="'+doc.numPages+'"></progress><p id="prtxt">0 / '+doc.numPages+' sivua</p></div>';
try{for(let n=1;n<=doc.numPages;n++){let page=await doc.getPage(n),tc=await page.getTextContent(),text=tc.items.map(i=>i.str+(i.hasEOL?'\n':' ')).join(' ').replace(/[ \t]+/g,' ').replace(/\n +/g,'\n');pages.push({n,text});$('#pr').value=n;$('#prtxt').textContent=n+' / '+doc.numPages+' sivua';if(n%5===0)await new Promise(r=>setTimeout(r,0))}buildNavigation();await put('page-index',pages);$('#setup').innerHTML='<div class="status">✓ Sääntökirjan '+pages.length+' sivua indeksoitu. Haut toimivat offline-tilassa tällä laitteella.</div>';building=false;render()}
catch(e){building=false;status('Indeksointi epäonnistui: '+e.message)}}
async function importFile(file){if(!file)return;if(!/pdf/i.test(file.type)&&!file.name.toLowerCase().endsWith('.pdf')){status('Valitse PDF-tiedosto.');return}try{let data=await file.arrayBuffer();if(data.byteLength<1000||new TextDecoder().decode(data.slice(0,5))!=='%PDF-')throw Error('Tiedosto ei ole kelvollinen PDF');await openPDF(data);await put(KEY,data);await put('file-name',file.name);await indexPDF()}catch(e){status('PDF:n lukeminen epäonnistui: '+e.message)}}
async function restore(){try{favorites=new Set((await get('favorites'))||[]);pages=(await get('page-index'))||[];buildNavigation();let stored=await get(KEY);if(stored){bytes=new Uint8Array(stored);$('#setup').innerHTML='<div class="status">✓ Oma sääntökirja on tallennettu. '+pages.length+' sivua haettavissa offline-tilassa.</div><div class="row"><label class="button file-label primary" for="pdfFile">Vaihda PDF</label><button class="secondary" id="removePDF">Poista tallennettu PDF</button></div>';$('#removePDF').onclick=async()=>{await remove(KEY);await remove('page-index');await remove('file-name');bytes=null;pages=[];render()};if(!pages.length){await openPDF(stored);await indexPDF()}}else showImport();render()}catch(e){showImport();$('#setup').insertAdjacentHTML('beforeend','<p class="warning">Paikallinen tallennus ei ole käytettävissä: '+esc(e.message)+'</p>')}}
function showImport(){$('#setup').innerHTML='<div class="panel"><h2>1. Lisää oma sääntökirja</h2><p>Valitse puhelimelta tai tietokoneelta sääntökirjan PDF. Sovellus lukee sen sisällön laitteella, tekee koko tekstin hakukelpoiseksi ja tallentaa PDF:n sekä hakuindeksin vain tähän selaimeen.</p><label class="primary file-label" for="pdfFile">📄 Valitse sääntökirjan PDF</label><p class="small">PDF-tiedostoa ei lähetetä palvelimelle. Ensimmäisellä kerralla tarvitaan verkkoyhteys PDF-lukijakirjaston lataamiseen. Sen jälkeen haut toimivat ilman internetiä, jos selaimen tallennustila ja välimuisti säilyvät.</p></div>'}
document.body.insertAdjacentHTML('beforeend','<input type="file" id="pdfFile" accept="application/pdf,.pdf">');$('#pdfFile').addEventListener('change',e=>importFile(e.target.files?.[0]));

function buildNavigation(){
 ruleMap={};tocItems=[];
 // Read section headings from the document body, not its table of contents.
 for(const p of pages){
  if(p.n<29)continue;
  const lines=p.text.split(/\n/).map(x=>x.trim()).filter(Boolean);
  for(let i=0;i<lines.length;i++){
   const line=lines[i];
   let main=line.match(/^SÄÄNTÖ\s+(\d{1,3})(?:\s|$)/i);
   if(main){const key=main[1];if(!ruleMap[key])ruleMap[key]={page:p.n,label:(lines[i+1]||'').slice(0,100),offset:i};continue}
   let sub=line.match(/^(\d{1,3}\.\d{1,2})\.(?:\s|$)/);
   if(sub){const key=sub[1];if(!ruleMap[key])ruleMap[key]={page:p.n,label:(lines[i+1]||'').slice(0,100),offset:i}}
  }
 }
 // On some PDF pages the heading and number appear on the same extracted line.
 for(const p of pages){if(p.n<29)continue;let m;const re=/(?:^|\n)\s*(?:SÄÄNTÖ\s+)?(\d{1,3}\.\d{1,2})\.\s+(?=[A-ZÅÄÖ])/g;while((m=re.exec(p.text))){if(!ruleMap[m[1]])ruleMap[m[1]]={page:p.n,label:'',offset:0}}}
 // Extract clickable entries from the PDF's own contents pages.
 for(const p of pages){if(p.n<16||p.n>28)continue;
  let chunks=p.text.split(/\n/).map(x=>x.trim()).filter(Boolean);
  for(let i=0;i<chunks.length;i++){
   let line=chunks[i],head=line.match(/^SÄÄNTÖ\s+(\d{1,3})(?:\s+|$)/i),sub=line.match(/^(\d{1,3}\.\d{1,2})\.(?:\s+|$)/);
   if(!head&&!sub)continue;
   let key=head?head[1]:sub[1],desc=(line.replace(/^SÄÄNTÖ\s+\d{1,3}\s*|^\d{1,3}\.\d{1,2}\.\s*/i,'')+' '+(chunks[i+1]||'')).replace(/\.{3,}[\s\S]*/,'').trim().slice(0,85);
   let match=(line+' '+(chunks[i+1]||'')).match(/\.{3,}\s*(\d{1,3})\s*$/);
   let target=ruleMap[key]||((match&&Number(match[1])<=pages.length)?{page:Number(match[1]),label:desc}:null);
   if(target&&!tocItems.some(x=>x.key===key))tocItems.push({key,page:target.page,label:desc||target.label||''});
  }
 }
}
function goRule(key){
 key=String(key).replace(/\s+/g,'').replace(/\.$/,'');
 const dst=ruleMap[key]||tocItems.find(x=>x.key===key);
 if(!dst){alert('Sääntökohtaa '+key+' ei löytynyt tästä PDF-tiedostosta.');return}
 if(detail)navHistory.push({page:detail,rule:targetRule});detail=dst.page;targetRule=key;render();window.scrollTo(0,0);
}
function goPage(n){if(detail)navHistory.push({page:detail,rule:targetRule});detail=n;targetRule=null;render();window.scrollTo(0,0)}
function backlinks(){if(!navHistory.length){detail=null;targetRule=null}else{const old=navHistory.pop();detail=old.page;targetRule=old.rule}render();window.scrollTo(0,0)}
function refLinks(raw){
 // Generate HTML only after escaping text; no source HTML is interpreted.
 const pattern=/(→\s*)?(SÄÄNTÖ(?:ÖN|Ä|JEN)?\s+)(\d{1,3})(?:\s*\.\s*|\s+)(\d{1,2})(?!\d)|(?:→\s*)?(SÄÄNTÖ(?:ÖN|Ä|JEN)?\s+)(\d{1,3})(?![\d.])/gi;
 let html='',last=0,m;
 while((m=pattern.exec(raw))){html+=esc(raw.slice(last,m.index));let key=m[3]?m[3]+'.'+m[4]:m[6];html+=ruleMap[key]?'<a href="#rule-'+esc(key)+'" class="rulelink" data-rule="'+esc(key)+'">'+esc(m[0])+'</a>':esc(m[0]);last=pattern.lastIndex}
 return html+esc(raw.slice(last));
}
function linkedPage(p){
 if(!p)return'';
 let rows=p.text.split(/\n/),out=[];
 for(let i=0;i<rows.length;i++){
  let line=rows[i],main=line.match(/^\s*SÄÄNTÖ\s+(\d{1,3})(?:\s|$)/i),sub=line.match(/^\s*(\d{1,3}\.\d{1,2})\.(?:\s|$)/);
  let key=main?main[1]:sub?sub[1]:null;
  if(key&&ruleMap[key])out.push('<span class="section-entry" id="rule-'+esc(key)+'"><a href="#rule-'+esc(key)+'" class="rulelink" data-rule="'+esc(key)+'">'+esc(line)+'</a></span>');
  else out.push(refLinks(line));
 }
 return out.join('\n');
}
function tocHTML(){return '<div class="panel"><h2>Sisällysluettelo · siirry sääntökohtaan</h2><p>Valitse sääntö tai alakohta. Linkki avaa varsinaisen sääntötekstin sisältävän sivun.</p>'+tocItems.map(x=>'<div class="tocline"><a href="#rule-'+esc(x.key)+'" data-rule="'+esc(x.key)+'">Sääntö '+esc(x.key)+' '+esc(x.label)+'</a><span>Sivu '+x.page+'</span></div>').join('')+'</div>'}

function snippet(text,q){let clean=norm(text),pos=clean.indexOf(norm(q));if(pos<0){let words=norm(q).split(' ').filter(Boolean);pos=Math.max(0,clean.indexOf(words[0]||''))} // locate approximate region in original text
let originalPos=pos<0?0:Math.max(0,Math.round(pos*text.length/Math.max(1,clean.length)));let start=Math.max(0,originalPos-115),end=Math.min(text.length,originalPos+260),part=text.slice(start,end).replace(/\s+/g,' ');return (start?'…':'')+part+(end<text.length?'…':'')}
function highlight(text,q){let escaped=esc(text);let words=String(q).trim().split(/\s+/).filter(w=>w.length);for(let w of words){let pattern=w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');try{escaped=escaped.replace(new RegExp('('+pattern+')','ig'),'<mark>$1</mark>')}catch{}}return escaped}
function findHits(){let q=norm(term);if(!q)return[];let words=q.split(' ').filter(Boolean);let hits=[];for(const p of pages){let x=norm(p.text);if(words.every(w=>x.includes(w))){let count=words.reduce((sum,w)=>sum+x.split(w).length-1,0);let exact=x.includes(q);hits.push({...p,count,exact,rank:(exact?40:0)+count})}}return hits.sort((a,b)=>b.rank-a.rank||a.n-b.n)}
function group(p){let t=p.text;let m=[...t.matchAll(/(?:SÄÄNTÖ\s+)?(\d{1,3}(?:\.\d+)?)\.?(?=\s|\n)/g)];let nearby=m.filter(v=>Number(v[1].split('.')[0])>=1&&Number(v[1].split('.')[0])<=210);return nearby.length?'Sääntö '+nearby[0][1]:'Sivu '+p.n}
function render(){document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x.dataset.tab===tab));$('#hero').classList.toggle('hide',tab==='about'||!!detail);$('#detail').classList.toggle('hide',!detail);$('#about').classList.toggle('hide',tab!=='about');$('#results').classList.toggle('hide',tab==='about'||!!detail);$('#setup').classList.toggle('hide',tab==='about'||!!detail);
$('#pageTitle').textContent=tab==='penalties'?'Rangaistukset':tab==='favorites'?'Suosikit':'Hae sääntökirjasta';$('#pageIntro').textContent=tab==='penalties'?'Hae kaikki rangaistuksiin liittyvät maininnat suoraan PDF:n koko tekstistä.':tab==='favorites'?'Tallentamasi sivut ja osumat.':'Etsi sääntönumerolla, sanalla tai useammalla hakusanalla. Kaikki osumat näytetään.';
if(detail){let p=pages.find(p=>p.n===detail),id=detail,liked=favorites.has(id);$('#detail').innerHTML='<button class="secondary" id="back">← '+(navHistory.length?'Edelliseen sääntöön':'Hakutuloksiin')+'</button>'<div class="panel" style="margin-top:12px"><div class="row space"><h2>Sääntökirjan sivu '+id+'</h2><button class="secondary" id="fav">'+(liked?'★ Suosikki':'☆ Suosikiksi')+'</button></div><p>Tulos löytyy suoraan omasta PDF-tiedostostasi.</p><div class="row"><button class="secondary" id="prev">← Edellinen</button><button class="secondary" id="next">Seuraava →</button><button class="secondary" id="reader">Avaa PDF-näkymä</button></div><div id="pdfArea"></div>'+(p?'<h2>Sivun teksti · klikattavat sääntöviitteet</h2><p class="linkedtext" style="white-space:pre-wrap">'+linkedPage(p)+'</p>':'')+'</div>';$('#back').onclick=backlinks;$('#fav').onclick=async()=>{liked?favorites.delete(id):favorites.add(id);await put('favorites',[...favorites]);render()};$('#prev').onclick=()=>{if(id>1){goPage(id-1)}};$('#next').onclick=()=>{if(id<pages.length){goPage(id+1)}};$('#reader').onclick=()=>showCanvas(id);if(id>=16&&id<=28)$('#pdfArea').insertAdjacentHTML('beforebegin',tocHTML());if(targetRule){requestAnimationFrame(()=>{let el=document.getElementById('rule-'+targetRule);if(el)el.scrollIntoView({block:'center',behavior:'smooth'})})}return}
if(tab==='about'){$('#about').innerHTML='<div class="panel"><h2>Ohjeet</h2><p>Lisää sääntökirjan PDF kerran. Sovellus indeksoi jokaisen sivun koko tekstin, näyttää useita hakutuloksia, merkitsee hakusanat ja avaa vastaavan PDF-sivun sovelluksen sisällä.</p><p>Haussa käytetään kaikkia sanoja. Voit etsiä myös sääntönumerolla, esimerkiksi 57.2. Rangaistukset-välilehdellä haetaan erityisesti rikkeisiin ja seuraamuksiin liittyviä kohtia.</p><p>Haut ja tallennettu oma PDF toimivat ilman verkkoa, kun PDF on tuotu ja sovelluksen PDF-lukija on latautunut verkkoyhteydellä. Tyhjennetty selaimen tallennustila voi poistaa paikallisen dokumentin.</p><div class="warning">Koko sääntökirjaa ei julkaista tässä verkkosovelluksessa. PDF tuodaan käyttäjän omalta laitteelta ja pysyy paikallisena.</div></div>';return}
if(!pages.length){$('#results').innerHTML='<div class="empty">Lisää ensin sääntökirjan PDF, jotta haku toimii koko dokumentissa.</div>';return}
let entries;if(tab==='favorites')entries=[...favorites].sort((a,b)=>a-b).map(n=>pages.find(p=>p.n===n)).filter(Boolean);else if(tab==='penalties'){let q=term.trim();entries=q?findHits():pages.filter(p=>/RANGAISTUS|RIKKEET|TAKLAUS|KAMPITUS|KOUKKAAMINEN|HUITOMINEN|KEIHÄSTÄMINEN|ESTÄMINEN/i.test(p.text)).map(p=>({...p,count:0,rank:0}))}else entries=findHits();
let found=entries.length;$('#results').innerHTML=(tab==='search'&&!term?tocHTML():'')+'<div class="result-top"><strong>'+(tab==='favorites'?'Suosikkisivut':tab==='penalties'&&!term?'Rangaistuksia käsittelevät sivut':'Hakutulokset')+'</strong><span class="count">'+found+' sivua</span></div>'+(found?'<div class="results">'+entries.map(p=>'<button class="hit" data-page="'+p.n+'"><div class="row space"><strong>Sivu '+p.n+'</strong><span class="tag">'+(tab==='favorites'?'★ tallennettu':p.count?p.count+' osumaa':'Rangaistukset')+'</span></div><p class="excerpt">'+(term?highlight(snippet(p.text,term),term):esc(p.text.slice(0,210).replace(/\s+/g,' '))+'…')+'</p></button>').join('')+'</div>':'<div class="empty">'+(term?'Ei hakutuloksia. Kokeile eri taivutusmuotoa tai lyhyempää hakusanaa.':'Kirjoita hakusana, esimerkiksi kampitus, 57.2 tai korkea maila.')+'</div>');}
async function showCanvas(n){let area=$('#pdfArea');area.innerHTML='<p class="status">Avataan PDF-sivua…</p>';try{if(!doc){if(!bytes)throw Error('PDF ei ole tallennettu');await openPDF(bytes)}let page=await doc.getPage(n),vp=page.getViewport({scale:1}),available=area.clientWidth||400,scale=Math.min(2,available/vp.width),view=page.getViewport({scale}),canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');canvas.width=Math.round(view.width);canvas.height=Math.round(view.height);canvas.style.width='100%';canvas.style.height='auto';await page.render({canvasContext:ctx,viewport:view}).promise;area.replaceChildren(canvas)}catch(e){area.textContent='PDF-sivua ei voitu näyttää: '+e.message}}
