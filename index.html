const key='jaakiekon-saantohaku-suosikit';let saved;try{saved=new Set(JSON.parse(localStorage.getItem(key)||'[]'))}catch{saved=new Set()}let tab='rules',query='',category='Kaikki',selected=null;
const clean=s=>String(s).toLocaleLowerCase('fi').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rank(r){let q=clean(query),t=clean(r.title);return q?(String(r.id)===q?100:0)+(t===q?80:0)+(t.startsWith(q)?30:0)+(t.includes(q)?10:0):0}
function includes(r){let searchable=clean(r.id+' '+r.title+' '+r.group+' '+(aliases[r.id]||''));return clean(query).split(/\s+/).filter(Boolean).every(x=>searchable.includes(x))}

let html='';if(tab==='penalties'){html+='<div class="panel"><h2>Rangaistusten luettelo</h2><p>Rikkeet on ryhmitelty sääntönimikkeiden mukaan. Tässä ei arvioida automaattisesti rangaistuksen pituutta tai lajia.</p><div class="actions">'+[16,17,18,20,22,23].map(id=>{let r=RULES.find(r=>r.id===id);return '<button class="button secondary" data-rule="'+id+'">'+escapeHTML(r.title)+'</button>'}).join('')+'</div></div><div class="filters">'+TYPES.map(t=>'<button class="chip '+(category===t?'activechip':'')+'" data-group="'+escapeHTML(t)+'">'+escapeHTML(t)+'</button>').join('')+'</div>'}
